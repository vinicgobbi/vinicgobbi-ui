@if (active()) {
  <div class="decor" aria-hidden="true">
    @for (piece of confetti(); track piece.id) {
      <span
        class="confetto"
        [class.confetto--round]="piece.round"
        [style.left.%]="piece.left"
        [style.--size.px]="piece.size"
        [style.--color]="piece.color"
        [style.--sway.px]="piece.sway"
        [style.--spin.deg]="piece.spin"
        [style.--duration.s]="piece.duration"
        [style.--delay.s]="piece.delay"
      ></span>
    }

    @for (serpentine of serpentines(); track serpentine.id) {
      <svg
        class="serpentine"
        viewBox="0 0 20 120"
        [style.left.%]="serpentine.left"
        [style.--color]="serpentine.color"
        [style.--spin.deg]="serpentine.spin"
        [style.animation-duration.s]="serpentine.duration"
        [style.animation-delay.s]="serpentine.delay"
      >
        <path [attr.d]="serpentinePath" />
      </svg>
    }

    @for (item of burst(); track item.id) {
      <span
        class="burst"
        [style.--dx]="item.dx"
        [style.--dy]="item.dy"
        [style.--spin]="item.spin"
        [style.font-size.px]="item.size"
        [style.animation-delay.ms]="item.delay"
        >{{ item.icon }}</span
      >
    }
  </div>

  <div class="greeting" role="status">
    <button
      type="button"
      class="greeting__action"
      (click)="release()"
      aria-label="Soltar confete"
      title="Soltar confete"
    >
      🎭
    </button>
    <p>Bom Carnaval!</p>
  </div>
}
