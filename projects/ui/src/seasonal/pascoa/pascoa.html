@if (active()) {
  <div class="decor" aria-hidden="true">
    @for (egg of eggs(); track egg.id) {
      <span
        class="egg"
        [style.left.%]="egg.left"
        [style.--size.px]="egg.size"
        [style.--color]="egg.color"
        [style.--band]="egg.band"
        [style.--sway.px]="egg.sway"
        [style.animation-duration.s]="egg.duration"
        [style.animation-delay.s]="egg.delay"
      ></span>
    }

    <div class="bunny">
      <span class="bunny__body">🐇</span>
    </div>

    @for (item of burst(); track item.id) {
      <span
        class="burst"
        [style.--dx]="item.dx"
        [style.--dy]="item.dy"
        [style.--spin]="item.spin"
        [style.font-size.px]="item.size"
        [style.animation-delay.ms]="item.delay"
        >{{ item.icon }}</span
      >
    }
  </div>

  <div class="greeting" role="status">
    <button
      type="button"
      class="greeting__action"
      (click)="release()"
      aria-label="Soltar ovinhos"
      title="Soltar ovinhos"
    >
      🐰
    </button>
    <p>Feliz Páscoa!</p>
  </div>
}
