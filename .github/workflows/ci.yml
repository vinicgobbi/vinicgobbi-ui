# Valida cada push na development e cada pull request: formatação, testes e
# build da biblioteca e do showcase. Não publica nada (ver release.yml).
name: CI

on:
  push:
    branches:
      - development
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A versão do pnpm vem do "packageManager" do package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check code style (Prettier)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Compila a biblioteca antes, porque o showcase a importa de dist/.
      - name: Test
        run: pnpm test --watch=false

      - name: Build
        run: pnpm build
