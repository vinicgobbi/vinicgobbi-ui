# Etapas: validate → release → publish.
#
# Cada push na main gera uma versão (Commitizen) e publica @vinicgobbi/ui no
# GitHub Packages (npm.pkg.github.com). Por isso a main só recebe merge
# quando a versão está pronta.
#
# A publicação usa o GITHUB_TOKEN do próprio workflow (permissão packages:
# write); não há token guardado no repositório. O pacote fica ligado a este
# repositório pelo campo "repository" de projects/ui/package.json.
name: Release and publish

on:
  push:
    branches:
      - main

# Uma release por vez: um push novo espera o anterior terminar.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'bump:')"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A versão do pnpm vem do "packageManager" do package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check code style (Prettier)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test --watch=false

  # Versiona (Commitizen) e cria a release no GitHub. O commit "bump:" e a
  # tag vão com o GITHUB_TOKEN, que não dispara outro workflow; o "if" do
  # validate protege caso troque por um PAT.
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cz.outputs.version }}
      bumped: ${{ steps.cz.outputs.previous_version != steps.cz.outputs.next_version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Bump version with Commitizen
        id: cz
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog_increment_filename: body.md
          push: true
          git_name: github-actions[bot]
          git_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Create GitHub release
        if: steps.cz.outputs.previous_version != steps.cz.outputs.next_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.cz.outputs.version }}
        run: gh release create "$TAG" --title "$TAG" --notes-file body.md --verify-tag

  publish:
    needs: release
    if: needs.release.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar no GitHub Packages

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A tag criada pelo bump, com as versões já atualizadas.
          ref: v${{ needs.release.outputs.version }}

      # A versão do pnpm vem do "packageManager" do package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vinicgobbi'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build library
        run: pnpm build:lib

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish dist/vinicgobbi/ui
